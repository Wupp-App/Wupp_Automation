name: Sozluk Kazima ve Yapay Zeka Botu

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari GitHub'dan cek
        uses: actions/checkout@v3

      - name: Python Sistemini Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kutuphaneleri Yukle
        run: |
          pip install requests beautifulsoup4 supabase groq cloudscraper

      - name: Botu Calistir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python script.py
