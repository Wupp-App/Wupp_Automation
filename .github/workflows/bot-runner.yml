name: Wupp AI Bot Runner

on:
  schedule:
    # Her 20 dakikada bir çalışır (Günde 72 döngü -> Tam hedeflediğin 70-100 entry bandı)
    - cron: '*/20 * * * *'
  # İstediğin zaman GitHub panelinden manuel tetikleyebilmek için:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Bot Döngüsünü Çalıştır
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run bot:run
